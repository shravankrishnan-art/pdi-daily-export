name: Daily API to GSheets Export

on:
  schedule:
   - cron: '45 11 * * *' # Runs daily at 11:45 UTC (6:45 AM EST)
  workflow_dispatch:     # Allows you to trigger it manually via GitHub UI

jobs:
  run-export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests gspread google-auth

      - name: Run daily export script
        env:
          API_URL: ${{ secrets.API_URL }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          python export.py
